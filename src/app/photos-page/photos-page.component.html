<div id="title" class="page-title">
  Photo Gallery
</div>

<div class="gallery-container">
  <div class="gallery-grid">
    <img *ngFor="let image of images; let first = first" [src]="'assets/images/' + image" [alt]="image"
      [attr.loading]="first ? 'eager' : 'lazy'" [attr.fetchpriority]="first ? 'high' : null" decoding="async"
      class="gallery-image">
  </div>
</div>
